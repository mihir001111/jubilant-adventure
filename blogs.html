<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minimal Human Flower Animation</title>

  <style>
    :root {
      --bg: #faf9f6;
      --ink: #171717;
      --accent: #d97855;
      --speed: 9s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
    }


    /* =====================================================
   CONTAINER
   ===================================================== */

    .hero-animation {
      width: 100%;
      height: 100vh;
      min-height: 600px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =====================================================
   SVG
   ===================================================== */

    .art {
      width: min(1000px, 90vw);
      height: auto;
    }


    /* =====================================================
   BASIC LINES
   ===================================================== */

    .line {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.1;

      stroke-linecap: round;
      stroke-linejoin: round;

      vector-effect: non-scaling-stroke;
    }

    .thin {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.4;

      stroke-linecap: round;
      stroke-linejoin: round;

      vector-effect: non-scaling-stroke;
    }

    .accent {
      fill: var(--accent);
    }

    .accent-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.7;

      stroke-linecap: round;
      stroke-linejoin: round;

      vector-effect: non-scaling-stroke;
    }


    /* =====================================================
   PERSON
   ===================================================== */

    .person {
      animation: breathe var(--speed) ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes breathe {

      0%,
      20% {
        transform: translateY(0);
      }

      35% {
        transform: translateY(-2px);
      }

      48% {
        transform: translateY(1px);
      }

      65%,
      100% {
        transform: translateY(0);
      }
    }


    /* =====================================================
   HAIR — ONLY ONE SIMPLE CURVE
   ===================================================== */

    .hair {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.1;
      stroke-linecap: round;

      vector-effect: non-scaling-stroke;
    }


    /* =====================================================
   FLOWER BENDS WHEN BLOWN
   ===================================================== */

    .flower {
      transform-box: fill-box;
      transform-origin: bottom center;

      animation:
        flowerBlow var(--speed) ease-in-out infinite;
    }

    @keyframes flowerBlow {

      0%,
      22% {
        transform: rotate(0deg);
      }

      38% {
        transform: rotate(-3deg);
      }

      50% {
        transform: rotate(-7deg);
      }

      63% {
        transform: rotate(-3deg);
      }

      75%,
      100% {
        transform: rotate(0deg);
      }
    }


    /* =====================================================
   BREATH LINES
   ===================================================== */

    .breath {
      opacity: 0;

      stroke-dasharray: 100;
      stroke-dashoffset: 100;

      animation:
        breath var(--speed) ease-out infinite;
    }

    .breath.two {
      animation-delay: .15s;
    }

    @keyframes breath {

      0%,
      22% {
        opacity: 0;
        stroke-dashoffset: 100;
      }

      35% {
        opacity: .3;
      }

      48% {
        opacity: .65;
        stroke-dashoffset: 0;
      }

      60% {
        opacity: .15;
        stroke-dashoffset: -35;
      }

      70%,
      100% {
        opacity: 0;
      }
    }


    /* =====================================================
   PETALS
   ===================================================== */

    .petal {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }


    /* Petal 1 */

    .p1 {
      animation:
        petal1 var(--speed) cubic-bezier(.2, .7, .2, 1) infinite;
    }

    @keyframes petal1 {

      0%,
      35% {
        opacity: 0;
        transform: translate(0, 0) rotate(0);
      }

      42% {
        opacity: 1;
      }

      70% {
        opacity: .8;
        transform: translate(-140px, -45px) rotate(120deg);
      }

      92% {
        opacity: 0;
        transform: translate(-280px, -90px) rotate(220deg);
      }

      100% {
        opacity: 0;
      }
    }


    /* Petal 2 */

    .p2 {
      animation:
        petal2 var(--speed) cubic-bezier(.2, .7, .2, 1) infinite;
    }

    @keyframes petal2 {

      0%,
      39% {
        opacity: 0;
        transform: translate(0, 0) rotate(0);
      }

      46% {
        opacity: 1;
      }

      72% {
        opacity: .75;
        transform: translate(-155px, 20px) rotate(-100deg);
      }

      94% {
        opacity: 0;
        transform: translate(-300px, 60px) rotate(-210deg);
      }

      100% {
        opacity: 0;
      }
    }


    /* Petal 3 */

    .p3 {
      animation:
        petal3 var(--speed) cubic-bezier(.2, .7, .2, 1) infinite;
    }

    @keyframes petal3 {

      0%,
      43% {
        opacity: 0;
        transform: translate(0, 0) rotate(0);
      }

      50% {
        opacity: 1;
      }

      74% {
        opacity: .7;
        transform: translate(-180px, -5px) rotate(160deg);
      }

      96% {
        opacity: 0;
        transform: translate(-330px, -25px) rotate(280deg);
      }

      100% {
        opacity: 0;
      }
    }


    /* Petal 4 */

    .p4 {
      animation:
        petal4 var(--speed) cubic-bezier(.2, .7, .2, 1) infinite;
    }

    @keyframes petal4 {

      0%,
      47% {
        opacity: 0;
        transform: translate(0, 0) rotate(0);
      }

      54% {
        opacity: 1;
      }

      77% {
        opacity: .65;
        transform: translate(-125px, -70px) rotate(-130deg);
      }

      97% {
        opacity: 0;
        transform: translate(-270px, -120px) rotate(-250deg);
      }

      100% {
        opacity: 0;
      }
    }


    /* Petal 5 */

    .p5 {
      animation:
        petal5 var(--speed) cubic-bezier(.2, .7, .2, 1) infinite;
    }

    @keyframes petal5 {

      0%,
      51% {
        opacity: 0;
        transform: translate(0, 0) rotate(0);
      }

      58% {
        opacity: 1;
      }

      80% {
        opacity: .6;
        transform: translate(-165px, 65px) rotate(110deg);
      }

      98% {
        opacity: 0;
        transform: translate(-310px, 100px) rotate(230deg);
      }

      100% {
        opacity: 0;
      }
    }


    /* =====================================================
   MOBILE
   ===================================================== */

    @media (max-width: 700px) {

      .hero-animation {
        min-height: 450px;
      }

      .art {
        width: 110vw;
      }
    }


    /* =====================================================
   REDUCED MOTION
   ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .person,
      .flower,
      .breath,
      .petal {
        animation: none !important;
      }

      .petal {
        opacity: .7;
      }
    }
  </style>
</head>
